services:
  db:
    image: postgres:18         
    container_name: bas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql         
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 30s
      start_interval: 2s
      interval: 60s
      timeout: 3s
  mqtt:
    image: eclipse-mosquitto:2       
    container_name: bas-mosquitto

    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_GATEWAY_USERNAME: ${MQTT_GATEWAY_USERNAME:?set MQTT_GATEWAY_USERNAME in .env}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?set MQTT_GATEWAY_PASSWORD in .env}

    command: >
      sh -c 'rm -f /mosquitto/passwd /mosquitto/acl
      && mosquitto_passwd -b -c /mosquitto/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"
      && mosquitto_passwd -b /mosquitto/passwd "$MQTT_GATEWAY_USERNAME" "$MQTT_GATEWAY_PASSWORD"
      && printf "user %s\ntopic read bas/#\ntopic write bas/+/cmd\n\nuser %s\ntopic read bas/+/cmd\ntopic write bas/+/status\ntopic write bas/+/birth\ntopic write bas/+/data\ntopic write bas/+/cmd/ack\n" "$MQTT_USERNAME" "$MQTT_GATEWAY_USERNAME" > /mosquitto/acl
      && chown mosquitto:mosquitto /mosquitto/passwd /mosquitto/acl
      && chmod 0700 /mosquitto/passwd /mosquitto/acl
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    ports:
      - "1884:1883"                   
      - "127.0.0.1:9001:9001"               
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      start_period: 20s
      start_interval: 2s
      interval: 60s
      timeout: 3s
  nodered:
    image: nodered/node-red:latest
    container_name: bas-nodered
    environment:
      MQTT_USERNAME: ${MQTT_GATEWAY_USERNAME:?set MQTT_GATEWAY_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?set MQTT_GATEWAY_PASSWORD in .env}
      NODERED_ADMIN_USER: ${NODERED_ADMIN_USER:-admin}
      NODERED_ADMIN_PASSWORD_HASH: ${NODERED_ADMIN_PASSWORD_HASH:-}
    ports:
      - "${NODERED_HOST:-127.0.0.1}:${NODERED_PORT:-1880}:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      mqtt:
        condition: service_healthy
  backend:
    build: .
    container_name: bas-backend
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./migrations
  frontend:
    build: ../Frontend
    container_name: bas-frontend
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5300}:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ../Frontend/src
        - action: rebuild
          path: ../Frontend/package.json
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: bas-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_HOST:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
volumes:
  pgdata:
  mosquitto-data:
  pgadmin-data:
